<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script src="/qrcode.js"></script>
<style>
  :root { --bg:#120d0e; --bg2:#1a1315; --bg3:#231a1c; --linha:#33272a; --linha2:#463639; --tx:#f6eeeb; --tx2:#ab9c99; --tx3:#7d6d6b; --red:#e5484d; --ok:#46c08a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.5 Manrope, system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { margin: 0; font: 800 26px 'Space Grotesk', sans-serif; }
  .btn { height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--linha2); background: var(--bg3); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { border-color: #6a5052; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.pri { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.sm { height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--tx2); }
  .btn.ghost:hover { color: var(--tx); background: var(--bg3); }
  .btn.perigo { color: #ff8a8d; }
  input { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--linha2); background: var(--bg); outline: none; }
  input:focus { border-color: var(--red); }
  label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: var(--tx2); }
  .card { background: var(--bg2); border: 1px solid var(--linha); border-radius: 18px; padding: 20px; }
  .erro { color: #ff8a8d; font-size: 13px; min-height: 18px; margin: 0; }
  .dica { color: var(--tx3); font-size: 13px; margin: 0; }

  /* login */
  .login { max-width: 380px; margin: 14vh auto 0; display: grid; gap: 16px; }
  .abas { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--bg); border: 1px solid var(--linha); }
  .abas button { height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--tx2); font-weight: 800; cursor: pointer; }
  .abas button.on { background: rgba(229,72,77,.18); color: #fff; }
  .login form { display: grid; gap: 12px; }

  /* lista */
  .topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .topo p { margin: 4px 0 0; color: var(--tx2); font-size: 14px; }
  .criar { display: flex; gap: 8px; align-items: center; }
  .criar input { width: 76px; height: 44px; text-align: center; }
  .busca { margin-bottom: 12px; }
  .lista { display: grid; }
  .item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 14px; cursor: pointer; border: 1px solid transparent; }
  .item + .item { border-top-color: var(--linha); border-radius: 0; }
  .item:hover { background: var(--bg2); border-radius: 14px; border-color: var(--linha); }
  .num { width: 52px; height: 52px; border-radius: 12px; background: var(--bg3); display: grid; place-items: center; font: 800 18px 'Space Grotesk', sans-serif; }
  .item b { display: block; font-size: 15px; }
  .item small { display: block; font-size: 13px; color: var(--tx2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small.sem { color: #f0b35a; }
  .leituras { font-size: 12.5px; font-weight: 700; color: var(--tx3); white-space: nowrap; }
  .vazio { padding: 48px 0; text-align: center; color: var(--tx2); }

  /* janela do QR */
  .fundo { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 16px; z-index: 10; overflow-y: auto; }
  .janela { width: 100%; max-width: 440px; display: grid; gap: 14px; }
  .jtopo { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .jtopo h2 { margin: 0; font: 800 20px 'Space Grotesk', sans-serif; }
  .qrbox { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; align-items: center; }
  .qrimg { width: 132px; height: 132px; padding: 10px; border-radius: 14px; background: #fff; }
  .qrimg img, .qrimg canvas { width: 112px !important; height: 112px !important; display: block; }
  .link-fixo { font-size: 13px; font-weight: 700; color: #fca5a5; word-break: break-all; }
  .qrbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pe { display: flex; justify-content: space-between; gap: 8px; }
  .aviso { margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(240,179,90,.35); background: rgba(240,179,90,.08); color: #f0c98a; font-size: 13.5px; font-weight: 600; }
  .hist { display: grid; gap: 2px; max-height: 150px; overflow-y: auto; font-size: 12.5px; color: var(--tx2); }
  .hist div { padding: 6px 0; border-top: 1px solid var(--linha); overflow-wrap: anywhere; }
  .hist b { color: var(--tx); font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 700; z-index: 20; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ENTRAR -->
  <div class="card login hidden" id="tela-login">
    <h1>Painel de QR codes</h1>
    <div class="abas"><button type="button" class="on" data-aba="zap">WhatsApp</button><button type="button" data-aba="senha">Senha</button></div>

    <form id="f-zap">
      <div id="passo-tel">
        <label>Seu WhatsApp<input id="tel" inputmode="tel" placeholder="(14) 99999-9999" autocomplete="tel"></label>
      </div>
      <div id="passo-cod" class="hidden">
        <label>Código que chegou no WhatsApp<input id="cod" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code"></label>
        <p class="dica">Não chegou? <a href="#" id="reenviar" style="color:#fca5a5">Pedir outro</a></p>
      </div>
      <p class="erro" id="erro-zap"></p>
      <button class="btn pri" type="submit" id="btn-zap">Receber código</button>
    </form>

    <form id="f-senha" class="hidden">
      <label>Senha de admin<input id="senha" type="password" autocomplete="current-password"></label>
      <p class="erro" id="erro-senha"></p>
      <button class="btn pri" type="submit">Entrar</button>
    </form>
  </div>

  <!-- PAINEL -->
  <div id="tela-painel" class="hidden">
    <div class="topo">
      <div><h1>QR codes</h1><p>Toque num QR para trocar para onde ele leva.</p></div>
      <div class="criar">
        <input id="qtd" type="number" min="1" max="200" value="10" aria-label="Quantos QR codes criar">
        <button class="btn pri" id="btn-criar" type="button">Criar QR codes</button>
        <button class="btn sm" id="btn-exportar" type="button" title="Baixa a lista com número, nome, link fixo e destino">Exportar lista</button>
        <button class="btn ghost sm" id="btn-sair" type="button">Sair</button>
      </div>
    </div>
    <p class="aviso hidden" id="aviso-dominio">O domínio fixo ainda não foi definido (variável PUBLIC_URL). Defina o domínio definitivo antes de imprimir plaquinhas: o endereço que vai no QR não pode mudar depois.</p>
    <input class="busca" id="busca" placeholder="Buscar por número, nome ou link" autocomplete="off">
    <div class="card" style="padding: 6px"><div class="lista" id="lista"></div></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const ler = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const gravar = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
let base = location.origin, links = [];
const urlDo = (codigo) => `${base}/${codigo}`;
const dataBR = (s) => s ? new Date(s.replace(" ", "T") + "Z").toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";

function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

async function chamar(caminho, opcoes = {}) {
  const resp = await fetch(`/api${caminho}`, { ...opcoes, headers: { "Content-Type": "application/json", Authorization: `Bearer ${ler("qr_token")}` } });
  const dados = await resp.json().catch(() => ({}));
  if (resp.status === 401 && caminho.startsWith("/links")) { mostrarLogin(); throw new Error("Entre de novo"); }
  if (!resp.ok) throw new Error(dados.error || "Erro");
  return dados;
}

/* ---------- entrar ---------- */
function mostrarLogin() { gravar("qr_token", ""); $("tela-painel").classList.add("hidden"); $("tela-login").classList.remove("hidden"); }
function entrou(token) { gravar("qr_token", token); carregar(); }

document.querySelectorAll("[data-aba]").forEach((b) => b.onclick = () => {
  document.querySelectorAll("[data-aba]").forEach((x) => x.classList.toggle("on", x === b));
  $("f-zap").classList.toggle("hidden", b.dataset.aba !== "zap");
  $("f-senha").classList.toggle("hidden", b.dataset.aba !== "senha");
});

let esperandoCodigo = false;
async function pedirCodigo() {
  $("erro-zap").textContent = "";
  await chamar("/login", { method: "POST", body: JSON.stringify({ telefone: $("tel").value }) });
  esperandoCodigo = true;
  $("passo-cod").classList.remove("hidden");
  $("btn-zap").textContent = "Entrar";
  $("cod").focus();
}
$("f-zap").addEventListener("submit", async (e) => {
  e.preventDefault();
  const b = $("btn-zap"); b.disabled = true;
  try {
    if (!esperandoCodigo) await pedirCodigo();
    else { const d = await chamar("/login/confirmar", { method: "POST", body: JSON.stringify({ telefone: $("tel").value, codigo: $("cod").value }) }); entrou(d.token); }
  } catch (err) { $("erro-zap").textContent = err.message; }
  b.disabled = false;
});
$("reenviar").onclick = async (e) => { e.preventDefault(); try { await pedirCodigo(); toast("Código enviado"); } catch (err) { $("erro-zap").textContent = err.message; } };

$("f-senha").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("erro-senha").textContent = "";
  try { const d = await chamar("/login/senha", { method: "POST", body: JSON.stringify({ senha: $("senha").value }) }); entrou(d.token); }
  catch (err) { $("erro-senha").textContent = err.message; }
});

$("btn-sair").onclick = async () => { try { await chamar("/sair", { method: "POST" }); } catch {} mostrarLogin(); };

/* ---------- lista ---------- */
async function carregar() {
  const d = await chamar("/links");
  receber(d);
  $("tela-login").classList.add("hidden");
  $("tela-painel").classList.remove("hidden");
  desenhar();
}

function receber(d) {
  base = d.base || location.origin; links = d.links || [];
  $("aviso-dominio").classList.toggle("hidden", !!d.fixo);
}

function desenhar() {
  const t = $("busca").value.trim().toLowerCase();
  const vis = links.filter((l) => !t || `${l.numero} ${l.nome} ${l.destino} ${l.codigo}`.toLowerCase().includes(t));
  $("lista").innerHTML = vis.length ? vis.map((l) => `
    <div class="item" data-codigo="${esc(l.codigo)}" role="button" tabindex="0">
      <span class="num">${l.numero}</span>
      <span style="min-width:0"><b>${esc(l.nome)}</b>${l.destino ? `<small>→ ${esc(l.destino)}</small>` : `<small class="sem">Sem destino ainda</small>`}</span>
      <span class="leituras">${l.cliques} ${l.cliques === 1 ? "leitura" : "leituras"}</span>
    </div>`).join("") : `<div class="vazio">${links.length ? "Nada encontrado." : 'Nenhum QR ainda. Escolha quantos e toque em "Criar QR codes".'}</div>`;
}
$("busca").addEventListener("input", desenhar);

$("lista").addEventListener("click", (e) => { const i = e.target.closest("[data-codigo]"); if (i) abrir(links.find((l) => l.codigo === i.dataset.codigo)); });
$("lista").addEventListener("keydown", (e) => { if (e.key === "Enter") { const i = e.target.closest("[data-codigo]"); if (i) i.click(); } });

$("btn-criar").onclick = async () => {
  const qtd = parseInt($("qtd").value, 10) || 1;
  const b = $("btn-criar"); b.disabled = true;
  try { const d = await chamar("/links", { method: "POST", body: JSON.stringify({ quantidade: qtd }) }); receber(d); desenhar(); toast(`${qtd} QR ${qtd === 1 ? "criado" : "codes criados"}`); }
  catch (err) { toast(err.message); }
  b.disabled = false;
};

$("btn-exportar").onclick = () => {
  const cel = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const linhas = [["numero", "nome", "link_fixo", "destino", "leituras", "ultima_leitura"].join(";")]
    .concat(links.map((l) => [l.numero, l.nome, urlDo(l.codigo), l.destino, l.cliques, l.ultimo_clique || ""].map(cel).join(";")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = `qr-codes-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

/* ---------- desenho do QR (sem internet, biblioteca local) ---------- */
function matrizQR(texto) { const qr = qrcode(0, "M"); qr.addData(texto); qr.make(); return qr; }
function qrCanvas(texto, px) {
  const qr = matrizQR(texto), n = qr.getModuleCount(), borda = 4, mod = Math.floor(px / (n + borda * 2));
  const tam = mod * (n + borda * 2), c = document.createElement("canvas");
  c.width = c.height = tam;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, tam, tam); g.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect((k + borda) * mod, (r + borda) * mod, mod, mod);
  return c;
}
function qrSvg(texto) {
  const qr = matrizQR(texto), n = qr.getModuleCount(), borda = 4, t = n + borda * 2;
  let d = "";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) d += `M${k + borda} ${r + borda}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${t} ${t}" shape-rendering="crispEdges"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function baixar(href, nome) { const a = document.createElement("a"); a.href = href; a.download = nome; a.click(); }

/* ---------- janela de um QR ---------- */
function abrir(l) {
  const f = document.createElement("div");
  f.className = "fundo";
  f.innerHTML = `
    <form class="card janela">
      <div class="jtopo"><h2>QR ${l.numero}</h2><button class="btn ghost sm" type="button" data-fechar aria-label="Fechar">✕</button></div>
      <div class="qrbox">
        <div class="qrimg" id="qr-img"></div>
        <div>
          <div class="link-fixo">${esc(urlDo(l.codigo))}</div>
          <p class="dica" style="margin-top:4px">Este é o link que vai no QR e no NFC. Ele nunca muda.</p>
          <div class="qrbtns"><button class="btn sm" type="button" data-baixar>Baixar PNG</button><button class="btn sm" type="button" data-svg title="Melhor para a gráfica: não perde qualidade em nenhum tamanho">Baixar SVG</button><button class="btn sm ghost" type="button" data-copiar>Copiar link</button></div>
        </div>
      </div>
      <label>Nome<input id="j-nome" value="${esc(l.nome)}" maxlength="80" placeholder="Ex.: Pizzaria do João"></label>
      <label>Para onde leva<input id="j-destino" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(l.destino)}" placeholder="Cole aqui o link de avaliação do Google"></label>
      ${l.destino ? `<p class="dica" style="margin-top:-6px"><a href="${esc(l.destino)}" target="_blank" rel="noopener noreferrer" style="color:#fca5a5">Testar destino atual</a>${l.alterado_em ? ` · alterado em ${esc(dataBR(l.alterado_em))}` : ""}</p>` : ""}
      <p class="erro" id="j-erro"></p>
      <div class="pe">
        <button class="btn ghost perigo" type="button" data-excluir>Excluir</button>
        <button class="btn pri" type="submit">Salvar destino</button>
      </div>
      <details><summary class="dica" style="cursor:pointer">Histórico de alterações</summary><div class="hist" id="j-hist" style="margin-top:8px">Carregando…</div></details>
    </form>`;
  document.body.appendChild(f);
  $("qr-img").appendChild(qrCanvas(urlDo(l.codigo), 600));
  const aoTeclar = (e) => { if (e.key === "Escape") fechar(); };
  const fechar = () => { f.remove(); document.removeEventListener("keydown", aoTeclar); };
  document.addEventListener("keydown", aoTeclar);
  f.querySelector("details").addEventListener("toggle", async (e) => {
    if (!e.target.open) return;
    const nomes = { criou: "Criado", destino: "Destino", nome: "Nome" };
    try {
      const d = await chamar(`/links/${encodeURIComponent(l.codigo)}/historico`);
      $("j-hist").innerHTML = d.historico.length ? d.historico.map((h) => `<div><b>${esc(nomes[h.acao] || h.acao)}</b> · ${esc(dataBR(h.em))} · ${esc(h.quem === "senha" ? "senha" : h.quem)}${h.acao === "criou" ? "" : `<br>${esc(h.antes || "(vazio)")} → ${esc(h.depois || "(vazio)")}`}</div>`).join("") : "Sem alterações.";
    } catch (err) { $("j-hist").textContent = err.message; }
  });
  f.querySelector("[data-fechar]").onclick = fechar;
  f.querySelector("[data-copiar]").onclick = async () => { try { await navigator.clipboard.writeText(urlDo(l.codigo)); toast("Link copiado"); } catch { toast(urlDo(l.codigo)); } };
  f.querySelector("[data-baixar]").onclick = () => {
    baixar(qrCanvas(urlDo(l.codigo), 2000).toDataURL("image/png"), `qr-${l.numero}.png`);
  };
  f.querySelector("[data-svg]").onclick = () => {
    const u = URL.createObjectURL(new Blob([qrSvg(urlDo(l.codigo))], { type: "image/svg+xml" }));
    baixar(u, `qr-${l.numero}.svg`); setTimeout(() => URL.revokeObjectURL(u), 1000);
  };
  f.querySelector("[data-excluir]").onclick = async () => {
    const r = prompt(`Excluir o QR ${l.numero}? Se ele já estiver impresso, a plaquinha para de funcionar para sempre.\n\nPara confirmar, digite o número ${l.numero}:`);
    if (r === null) return;
    if (String(r).trim() !== String(l.numero)) { $("j-erro").textContent = "Número não confere. Nada foi excluído."; return; }
    try { await chamar(`/links/${encodeURIComponent(l.codigo)}`, { method: "DELETE" }); fechar(); toast("QR excluído"); carregar(); } catch (err) { $("j-erro").textContent = err.message; }
  };
  f.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await chamar(`/links/${encodeURIComponent(l.codigo)}`, { method: "PUT", body: JSON.stringify({ nome: $("j-nome").value, destino: $("j-destino").value }) });
      fechar(); toast("Destino salvo"); carregar();
    } catch (err) { $("j-erro").textContent = err.message; }
  });
  setTimeout(() => $("j-destino").focus(), 50);
}

if (ler("qr_token")) carregar().catch(() => mostrarLogin()); else mostrarLogin();
</script>
</body>
</html>
